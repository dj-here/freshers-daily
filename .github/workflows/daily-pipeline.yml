name: Daily Fresher Jobs Pipeline

on:
  schedule:
    # Runs at 00:00 UTC (05:30 IST) every single day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows 1-click manual trigger anytime from GitHub UI

jobs:
  run-pipeline:
    name: Ingest, Verify & Publish Daily Openings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Daily Verification & Publishing Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://neondb_owner:npg_UPrjoK0VQcb6@ep-noisy-night-b4i7llso-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require' }}
          PYTHONPATH: backend
        run: |
          cd backend
          python -m app.cli run-daily --skip-ingest
